name: Tự kiểm tra

# Gắn tên nhánh được kiểm tra vào tiêu đề lần chạy để dễ phân biệt trong Actions.
run-name: Tự kiểm tra ${{ inputs.ref || github.ref_name }}

# Tệp workflow này chỉ nằm trên nhánh main của fork a2664955622/samp-mobile,
# dùng để tái hiện quá trình tự kiểm tra trên CI; không đưa vào các nhánh PR lên upstream.
#
# Cách dùng: Actions -> Tự kiểm tra -> Run workflow -> nhập tên nhánh hoặc commit SHA
# vào trường ref, ví dụ feat/cef-threading. Có thể chạy bằng lệnh:
#   gh workflow run selfcheck.yml --repo a2664955622/samp-mobile \
#       --ref main -f ref=feat/cef-threading
#
# Lý do có tham số ref: sự kiện push chỉ tìm workflow trên chính nhánh được đẩy lên.
# Tệp này không có trên feat/* nên push ở các nhánh đó không tự kích hoạt workflow.
# workflow_dispatch đọc định nghĩa từ main và lấy mã nguồn theo ref được chọn.
#
# Hai nguyên tắc:
#   1. Không sửa app/build.gradle hoặc tools/selfcheck.py — chỉ gọi chúng.
#   2. Không âm thầm bỏ qua lỗi. Bất kỳ bước nào thất bại thì CI phải báo lỗi.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tên nhánh hoặc commit SHA cần tự kiểm tra'
        required: true
        default: 'main'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: selfcheck-${{ github.event.inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Tự kiểm tra tĩnh (không biên dịch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: In thông tin commit được checkout
        run: |
          echo "ref=${{ github.event.inputs.ref || github.ref }}"
          echo "sha=$(git rev-parse HEAD)"
          git log -1 --format='%h %s'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Khi checkout sạch, kết quả dự kiến là 27 passed / 0 failed / 1 cảnh báo.
      # Cảnh báo APK chưa được build là bình thường ở giai đoạn trước khi biên dịch.
      # Tài sản riêng của GTA:SA không có trong kho mã; không cần --require-gtasa.
      - name: Tự kiểm tra kho mã
        run: python tools/selfcheck.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Không dùng android-actions/setup-android vì sdkmanager --licenses có thể
      # thất bại trong môi trường không tương tác. Runner đã có Android SDK cài sẵn.
      # Hai bước tiếp theo chỉ cần thiết với nhánh có bộ công cụ CEF; nhánh khác bỏ qua.
      - name: Chuẩn bị Android SDK
        if: hashFiles('tools/cef_kat/logic_tests/run_logic_tests.sh') != ''
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          [ -d "$SDK" ] || { echo "Không tìm thấy Android SDK"; exit 1; }
          SM=""
          for c in "$SDK"/cmdline-tools/latest/bin/sdkmanager "$SDK"/cmdline-tools/*/bin/sdkmanager; do
            [ -x "$c" ] && { SM="$c"; break; }
          done
          [ -n "$SM" ] || { echo "Không tìm thấy sdkmanager"; exit 1; }
          echo "SDK=$SDK"; echo "sdkmanager=$SM"
          # Chấp nhận giấy phép không tương tác.
          yes 2>/dev/null | "$SM" --licenses >/dev/null 2>&1 || true
          "$SM" --install "platforms;android-35"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Kiểm tra logic ngoại tuyến
        if: hashFiles('tools/cef_kat/logic_tests/run_logic_tests.sh') != ''
        run: bash tools/cef_kat/logic_tests/run_logic_tests.sh

  build:
    name: Biên dịch hai ABI và kiểm tra ký hiệu JNI
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Chuẩn bị Android SDK / NDK / CMake
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          [ -d "$SDK" ] || { echo "Không tìm thấy Android SDK"; exit 1; }
          SM=""
          for c in "$SDK"/cmdline-tools/latest/bin/sdkmanager "$SDK"/cmdline-tools/*/bin/sdkmanager; do
            [ -x "$c" ] && { SM="$c"; break; }
          done
          [ -n "$SM" ] || { echo "Không tìm thấy sdkmanager"; exit 1; }
          yes 2>/dev/null | "$SM" --licenses >/dev/null 2>&1 || true
          # Phiên bản NDK phải khớp ndkVersion trong build.gradle; CMake phải đáp ứng
          # cmake_minimum_required(3.22.1) để Android Gradle Plugin không tải thêm bản khác.
          "$SM" --install "platforms;android-35" "ndk;25.1.8937393" "cmake;3.22.1"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4

      # Một số tệp include <bass.h>, nhưng kho mã có Bass.h. Windows không phân biệt
      # chữ hoa/thường còn Linux thì có; tạo liên kết tượng trưng trong CI để biên dịch.
      - name: Tương thích tên tệp header viết hoa
        run: ln -sf Bass.h app/src/main/cpp/SAMPMOBILE/Deps/Bass/bass.h

      # Tùy chọn này tạo APK để kiểm tra biên dịch, không đóng gói thành APK có thể chơi.
      # CI không có các tài sản riêng của GTA:SA.
      - name: Biên dịch APK debug
        run: ./gradlew :app:assembleDebug -PskipGtasaCheck=true --no-daemon

      - name: Kiểm tra ký hiệu JNI được xuất
        if: hashFiles('tools/cef_kat/jni_symbol_check.sh') != ''
        run: bash tools/cef_kat/jni_symbol_check.sh

      # Bắt buộc APK phải tồn tại và có đủ thư viện .so hai ABI cùng assets.
      # Không dùng --require-gtasa vì CI không đóng gói tài sản riêng của trò chơi.
      - name: Tự kiểm tra cấu trúc APK
        run: python tools/selfcheck.py --require-apk

      # Lưu APK làm tệp đính kèm (artifact) của lần chạy GitHub Actions để tải xuống.
      - name: Tải APK lên GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: samp-mobile-debug-apk-${{ github.event.inputs.ref || github.ref_name }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
